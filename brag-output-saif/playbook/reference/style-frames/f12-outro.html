<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
  .lock { left: 0; right: 0; top: 150px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .mark { display: flex; align-items: center; gap: 30px; direction: ltr; }
  .mark .logo-cs { width: 124px; height: 124px; border-radius: 30px; font-size: 52px; line-height: 124px; }
  .word { font: 700 128px/1 "Plex"; }
  .line { margin-top: 46px; font: 700 84px/1.2 "Plex"; }
  .line span { color: var(--sa-600); }
  .url { margin-top: 30px; display: flex; gap: 26px; align-items: center; font: 600 36px/1 "Plex"; color: var(--ink-2); direction: ltr; }
  .url i { width: 8px; height: 8px; border-radius: 50%; background: #98a2b3; }
  .url .saif { color: var(--sa-600); }
  .cast { left: 0; right: 0; bottom: 30px; display: flex; justify-content: center; align-items: flex-end; gap: 90px; direction: ltr; }
  .cast > div { width: 250px; }
  .cast .s { width: 300px; }
  .floor { left: 300px; right: 300px; bottom: 44px; height: 3px; background: linear-gradient(90deg, transparent, #d0d5dd 20%, #d0d5dd 80%, transparent); }
</style></head>
<body><div class="stage day">
  <div class="abs lock">
    <div class="mark"><div class="logo-cs">CS</div><div class="word">CAUSASEAL</div></div>
    <div class="line">الصياغة تتغيّر. <span>السبب يبقى.</span></div>
    <div class="url"><span>causaseal.aboalrejal.com</span><i></i><span class="saif">SAIF 2026</span></div>
  </div>
  <div class="abs floor"></div>
  <div class="abs cast"><div id="agent"></div><div class="s" id="seal"></div><div id="guard"></div></div>
</div>
<script src="characters.js"></script>
<script>
  document.getElementById("agent").innerHTML = CAST.agent({ eyes: "happy", wave: true })
  document.getElementById("seal").innerHTML = CAST.seal({ mood: "happy" })
  document.getElementById("guard").innerHTML = CAST.guard({ mood: "calm", tip: true })
</script>
</body></html>
